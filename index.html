<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apuntes de Aristóteles</title>
    <style>
        :root {
            --bg-color: #f7f9fa;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --primary-color: #2980b9;
            --secondary-color: #7f8c8d;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --radius: 8px;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #1a252f;
        }

        .subtitle {
            color: var(--secondary-color);
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn {
            display: block;
            padding: 18px 24px;
            text-decoration: none;
            color: #ffffff;
            background-color: var(--primary-color);
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 12px rgba(41, 128, 185, 0.2);
        }

        .btn:hover {
            background-color: #2471a3;
            transform: translateY(-2px);
        }

        .btn-old {
            background-color: #95a5a6;
            box-shadow: 0 4px 12px rgba(149, 165, 166, 0.2);
        }

        .btn-old:hover {
            background-color: #7f8c8d;
        }

        footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Aristóteles: Apuntes</h1>
        <p class="subtitle">Selecciona la versión del documento que deseas consultar:</p>
        
        <div class="links-container">
            <!-- Enlace a la Versión 2.0 (Diseño destacado) -->
            <a href="ARISTOTELES%20-%20APUNTES%20-%20VERSION%20WEB%202-0.html" class="btn">
                📖 Ver Versión Web 2.0 (Actualizada)
            </a>

            <!-- Enlace a la Versión 1.0 (Diseño clásico) -->
            <a href="ARISTOTELES%20-%20APUNTES%20-%20VERSION%20WEB%201.0.html" class="btn btn-old">
                📚 Ver Versión Web 1.0 (Anterior)
            </a>
        </div>

        <footer>
            Índice de Contenidos Digitales
        </footer>
    </div>

</body>
</html>
